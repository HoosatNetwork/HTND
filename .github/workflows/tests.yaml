name: Tests

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  build:
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -tags=ci
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    name: Tests, ${{ matrix.os }}
    steps:

      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      # Increase the pagefile size on Windows to avoid running out of memory
      - name: Increase pagefile size on Windows
        if: runner.os == 'Windows'
        run: powershell -command .github\workflows\SetPageFileSize.ps1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        shell: bash
        run: ./build_and_test.sh -v


  stability-test-fast:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=ci
    name: Fast stability tests, ${{ github.head_ref }}
    steps:

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
          cache: true
          cache-dependency-path: go.sum

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install htnd
        run: go install ./...

      - name: Run fast stability tests
        working-directory: stability-tests
        env:
          SKIP_LONG_STABILITY_TESTS: 1
        run: ./install_and_test.sh